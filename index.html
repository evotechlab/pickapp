<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2196F3">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PickApp Pro</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --primary: #2196F3;
            --primary-dark: #1976D2;
            --success: #4CAF50;
            --danger: #F44336;
            --bg: #121212;
            --surface: #FFFFFF;
            --text-main: #212121;
            --text-secondary: #757575;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* App Bar */
        .app-bar {
            background: var(--surface); color: var(--text-main);
            padding: 12px 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #eee; z-index: 100;
        }
        .app-bar h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--primary); }

        /* Scanner Container */
        #scanner-wrapper {
            flex: 1; position: relative; background: #000;
            display: flex; justify-content: center; align-items: center;
        }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }

        /* Target Overlay */
        .scanner-overlay {
            position: absolute; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .reticle {
            width: 240px; height: 140px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: var(--radius);
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); position: relative;
        }
        .reticle::after {
            content: ""; position: absolute; top: 50%; left: 10%; width: 80%; height: 2px;
            background: var(--danger); box-shadow: 0 0 10px var(--danger);
            animation: scan 2s infinite ease-in-out;
        }
        @keyframes scan { 0%, 100% { top: 20%; opacity: 0.3; } 50% { top: 80%; opacity: 1; } }

        /* Bottom Action Sheet */
        #action-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--surface); border-radius: 24px 24px 0 0;
            padding: 24px; transform: translateY(105%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200; box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
        }
        #action-sheet.active { transform: translateY(0); }

        .sheet-header { text-align: center; margin-bottom: 20px; }
        .sheet-header h2 { margin: 0; font-size: 20px; color: var(--text-main); }
        .sheet-header p { margin: 4px 0; color: var(--text-secondary); font-family: monospace; font-size: 14px; }

        /* Quantity Selector */
        .quantity-picker {
            display: flex; justify-content: center; align-items: center;
            gap: 15px; margin: 24px 0;
        }
        .btn-round {
            width: 56px; height: 56px; border-radius: 50%; border: none;
            background: #F5F5F5; color: var(--text-main); font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .btn-round:active { background: #E0E0E0; }

        #qty-input {
            width: 100px; height: 60px; text-align: center; font-size: 32px;
            font-weight: 700; border: 2px solid #F5F5F5; border-radius: 12px;
            color: var(--primary);
        }

        /* Action Buttons */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-main {
            height: 64px; border: none; border-radius: var(--radius);
            color: white; font-weight: 700; font-size: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Success State */
        .success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--success); color: white; border-radius: 24px 24px 0 0;
            display: none; flex-direction: column; align-items: center;
            justify-content: center; z-index: 210;
        }
        .success-overlay.show { display: flex; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Status Icon Animations */
        .spin { animation: rotation 1s infinite linear; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } }
    </style>
</head>
<body>

    <header class="app-bar">
        <h1>PICKAPP PRO</h1>
        <span class="material-icons" id="cloud-status" style="color: var(--success)">cloud_done</span>
    </header>

    <main id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scanner-overlay" id="mirino">
            <div class="reticle"></div>
        </div>
    </main>

    <section id="action-sheet">
        <div class="success-overlay" id="success-msg">
            <span class="material-icons" style="font-size: 48px;">check_circle</span>
            <p>REGISTRATO!</p>
        </div>

        <div class="sheet-header">
            <h2 id="ui-prod-name">Prodotto Rilevato</h2>
            <p id="ui-prod-barcode">8000000000000</p>
        </div>

        <div class="quantity-picker">
            <button class="btn-round" onclick="updateQty(-1)"><span class="material-icons">remove</span></button>
            <input type="number" id="qty-input" value="1" inputmode="numeric">
            <button class="btn-round" onclick="updateQty(1)"><span class="material-icons">add</span></button>
        </div>

        <div class="btn-grid">
            <button id="btn-out" class="btn-main btn-out" onclick="executeTrade('OUT')">
                <span class="material-icons">trending_down</span> SCARICO
            </button>
            <button id="btn-in" class="btn-main btn-in" onclick="executeTrade('IN')">
                <span class="material-icons">trending_up</span> CARICO
            </button>
        </div>

        <button onclick="dismissSheet()" style="width: 100%; background: none; border: none; color: var(--text-secondary); margin-top: 20px; font-weight: 600;">ANNULLA</button>
    </section>

    <script>
        // CONFIGURAZIONE
        const WORKER_URL = "https://tyxghf.sviluppo-49a.workers.dev/";
        
        let html5QrCode;
        let isProcessing = false;
        let activeBarcode = "";

        // Inizializza lo scanner all'avvio
        function startCamera() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScan);
        }

        function onScan(decodedText) {
            if (isProcessing || decodedText === activeBarcode) return;
            
            activeBarcode = decodedText;
            if ("vibrate" in navigator) navigator.vibrate(80);

            document.getElementById('ui-prod-barcode').innerText = decodedText;
            document.getElementById('action-sheet').classList.add('active');
        }

        function updateQty(delta) {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) + delta;
            if (val > 0) input.value = val;
        }

        function dismissSheet() {
            document.getElementById('action-sheet').classList.remove('active');
            activeBarcode = "";
            document.getElementById('qty-input').value = 1;
        }

        async function executeTrade(type) {
            if (isProcessing) return;
            
            const qty = document.getElementById('qty-input').value;
            const statusIcon = document.getElementById('cloud-status');
            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');

            // Stato UI: Caricamento
            isProcessing = true;
            statusIcon.innerText = "sync";
            statusIcon.classList.add("spin");
            btnIn.disabled = true;
            btnOut.disabled = true;

            const data = {
                barcode: activeBarcode,
                qty: qty,
                type: type,
                timestamp: new Date().toISOString()
            };
            
            try {
    const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
        // SUCCESSOTUTTO OK
        document.getElementById('success-msg').style.background = "var(--success)";
        document.getElementById('success-msg').innerHTML = '<span class="material-icons" style="font-size: 48px;">check_circle</span><p>REGISTRATO!</p>';
        document.getElementById('success-msg').classList.add('show');
        statusIcon.innerText = "cloud_done";
        
        setTimeout(() => {
            document.getElementById('success-msg').classList.remove('show');
            dismissSheet();
        }, 1200);
    } else {
        // ERRORE DI LOGICA (Esempio: "Già fuori")
        statusIcon.innerText = "report_problem";
        document.getElementById('success-msg').style.background = "var(--danger)";
        document.getElementById('success-msg').innerHTML = `<span class="material-icons" style="font-size: 48px;">error</span><p>${result.error}</p>`;
        document.getElementById('success-msg').classList.add('show');
        
        if ("vibrate" in navigator) navigator.vibrate([100, 50, 100, 50, 100]); // Vibrazione di errore

        setTimeout(() => {
            document.getElementById('success-msg').classList.remove('show');
            isProcessing = false; // Permettiamo all'utente di correggere o annullare
            btnIn.disabled = false;
            btnOut.disabled = false;
        }, 3000);
    }
} catch (err) {
    statusIcon.innerText = "cloud_off";
    alert("Errore di rete. Controlla la connessione.");
} 

        window.onload = startCamera;
    </script>
</body>
</html>
