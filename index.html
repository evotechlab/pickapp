<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2196F3">
    <title>PickApp Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW registrato!', reg))
            .catch(err => console.log('Errore SW', err));
        });
      }
    </script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2196F3; --success: #4CAF50; --danger: #F44336; --bg: #121212; --surface: #FFFFFF; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .app-bar { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .app-bar h1 { margin: 0; font-size: 18px; color: var(--primary); }
        #scanner-wrapper { flex: 1; position: relative; background: #000; }
        #reader { width: 100% !important; height: 100% !important; }
        .scanner-overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; pointer-events:none; z-index:10; }
        .reticle { width: 260px; height: 160px; border: 2px solid rgba(255,255,255,0.4); border-radius: 16px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); }
        #action-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(110%); transition: 0.3s ease; z-index: 100; }
        #action-sheet.active { transform: translateY(0); }
        .sheet-header { text-align: center; }
        .qty-picker { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .btn-round { width: 50px; height: 50px; border-radius: 50%; border: none; background: #eee; font-size: 24px; }
        #qty-input { width: 80px; height: 50px; text-align: center; font-size: 24px; font-weight: bold; border: 1px solid #ddd; border-radius: 8px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-main { height: 60px; border: none; border-radius: 12px; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }
        .feedback-overlay { position: absolute; top:0; left:0; width:100%; height:100%; border-radius:24px 24px 0 0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:110; color:white; }
        .feedback-overlay.show { display: flex; }
        .spin { animation: rotation 1s infinite linear; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } }
    </style>
</head>
<body>
    <header class="app-bar">
        <h1>PICKAPP PRO</h1>
        <span class="material-icons" id="status-icon" style="color: var(--success)">cloud_done</span>
    </header>
    <main id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scanner-overlay"><div class="reticle"></div></div>
    </main>
    <section id="action-sheet">
        <div class="feedback-overlay" id="feedback"></div>
        <div class="sheet-header">
            <h2 style="margin:0">Oggetto Rilevato</h2>
            <p id="ui-barcode" style="font-family:monospace; color:#666">---</p>
        </div>
        <div class="qty-picker">
            <button class="btn-round" onclick="changeQty(-1)">-</button>
            <input type="number" id="qty-input" value="1" inputmode="numeric">
            <button class="btn-round" onclick="changeQty(1)">+</button>
        </div>
        <div class="btn-grid">
            <button id="btn-out" class="btn-main btn-out" onclick="send('OUT')"><span class="material-icons">logout</span> USCITA</button>
            <button id="btn-in" class="btn-main btn-in" onclick="send('IN')"><span class="material-icons">login</span> INGRESSO</button>
        </div>
        <button onclick="closeSheet()" style="width:100%; background:none; border:none; color:#999; margin-top:15px">ANNULLA</button>
    </section>
    <script>
        const WORKER_URL = "https://tyxghf.sviluppo-49a.workers.dev/";
        let scanner;
        let activeCode = "";
        let busy = false;

        function start() {
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (code) => {
                if(busy || code === activeCode) return;
                activeCode = code;
                if(navigator.vibrate) navigator.vibrate(80);
                document.getElementById('ui-barcode').innerText = code;
                document.getElementById('action-sheet').classList.add('active');
            });
        }

        function changeQty(n) {
            let i = document.getElementById('qty-input');
            let v = parseInt(i.value) + n;
            if(v > 0) i.value = v;
        }

        function closeSheet() {
            document.getElementById('action-sheet').classList.remove('active');
            activeCode = "";
        }

        async function send(type) {
            if(busy) return;
            busy = true;
            const icon = document.getElementById('status-icon');
            const fb = document.getElementById('feedback');
            icon.innerText = "sync"; icon.classList.add("spin");

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ barcode: activeCode, type: type, qty: document.getElementById('qty-input').value, date: new Date().toISOString() })
                });
                const data = await res.json();
                if(res.ok) {
                    fb.style.background = "var(--success)";
                    fb.innerHTML = '<span class="material-icons" style="font-size:48px">check_circle</span><p>OK!</p>';
                    fb.classList.add('show');
                    setTimeout(() => { fb.classList.remove('show'); closeSheet(); busy = false; icon.innerText = "cloud_done"; }, 1500);
                } else {
                    fb.style.background = "var(--danger)";
                    fb.innerHTML = `<span class="material-icons" style="font-size:48px">error</span><p>${data.error}</p>`;
                    fb.classList.add('show');
                    setTimeout(() => { fb.classList.remove('show'); busy = false; icon.innerText = "priority_high"; }, 3000);
                }
            } catch(e) {
                alert("Errore di rete");
                busy = false;
            } finally { icon.classList.remove("spin"); }
        }
        window.onload = start;
    </script>
</body>
</html>
