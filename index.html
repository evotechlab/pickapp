<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PICKAPP PRO - Magazzino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; color: #1e293b; overscroll-behavior-y: none; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Tema Colore Brand (Blu context image_0.png) */
        .brand-bg-blue { background-color: #3b82f6; } /* Blue 500 */
        .brand-text-blue { color: #1d4ed8; } /* Blue 700 */
        .brand-border-blue { border-color: #3b82f6; }

        /* Camera UI Embedded */
        #reader { width: 100%; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 4/3; background: #000; border: 2px solid #e2e8f0; }
        #reader video { object-fit: cover !important; }

        /* Overlay di scansione semplificato */
        #qr-shaded-region { border-color: rgba(248, 250, 252, 0.5) !important; }
        .scanner-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 5;}
        .laser-box { width: 70%; max-width: 250px; height: 150px; border: 2px solid white; border-radius: 8px; position: relative; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
        .laser-line { width: 100%; height: 2px; background: #ef4444; position: absolute; top: 50%; box-shadow: 0 0 10px #ef4444; animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 90%; opacity: 0; } }

        /* Feedback di connessione */
        .connection-status { width: 10px; height: 10px; border-radius: 50%; }
        .status-online { background-color: #10b981; animation: pulse 1.5s infinite; }
        .status-offline { background-color: #ef4444; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="loginScreen" class="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center p-6 hidden">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm border border-slate-200 shadow-xl">
            <div class="text-center mb-8 flex flex-col items-center gap-4">
                <i class="fa-solid fa-barcode text-5xl text-blue-600"></i> 
                <h2 class="text-3xl font-black text-slate-900 tracking-tighter">PICKAPP <span class="text-blue-600">PRO</span></h2>
            </div>
            <input type="text" id="userInp" placeholder="ID Operatore" class="w-full bg-slate-100 text-slate-900 border border-slate-200 p-4 rounded-xl mb-4 outline-none focus:border-blue-500 transition font-mono">
            <input type="password" id="passInp" placeholder="PIN" inputmode="numeric" class="w-full bg-slate-100 text-slate-900 border border-slate-200 p-4 rounded-xl mb-6 outline-none focus:border-blue-500 transition font-mono tracking-widest text-center text-xl">
            <button onclick="verifyLogin()" id="loginBtn" class="w-full brand-bg-blue text-white font-bold p-4 rounded-xl hover:bg-blue-600 active:scale-95 transition shadow-lg">
                Sblocca Terminale
            </button>
        </div>
    </div>

    <div id="authScreen" class="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center p-6 hidden">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm border border-slate-200 shadow-xl text-center">
            <i class="fa-brands fa-dropbox text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Connessione Server</h2>
            <p class="text-slate-500 mb-6 text-sm">Sincronizza il terminale con il magazzino centrale.</p>
            <button onclick="loginDropbox()" id="dbBtn" class="w-full bg-blue-600 text-white font-bold p-4 rounded-xl active:scale-95 transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-link"></i> Autorizza Dropbox
            </button>
        </div>
    </div>

    <div id="scannerScreen" class="hidden flex flex-col flex-1 pb-[env(safe-area-inset-bottom)]">
        
<header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm px-4 py-3 flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-barcode text-2xl text-blue-600"></i> 
                <div class="flex flex-col">
                    <h1 class="text-lg font-black tracking-tight text-slate-950">PICKAPP <span class="text-blue-600">PRO</span></h1>
                    <div class="flex items-center gap-1.5 text-xs text-slate-500">
                        <div id="connectionDot" class="connection-status status-offline"></div>
                        <span id="connectionText">Offline</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                
                <div id="syncBadgeContainer" class="relative hidden cursor-pointer transition-transform active:scale-95" onclick="processSyncQueue(true)">
                    <div class="bg-slate-100 p-2 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition" title="Sincronizza Dati">
                        <i class="fas fa-cloud-upload-alt text-lg"></i>
                    </div>
                    <span id="syncBadgeCount" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold h-4 w-4 flex items-center justify-center rounded-full shadow-sm">0</span>
                </div>

                <button onclick="hardLogout()" class="text-slate-400 hover:text-rose-600 p-2 rounded-lg hover:bg-rose-50 transition" title="Disconnetti">
                    <i class="fa-solid fa-power-off text-lg"></i>
                </button>
                
            </div>
            
        </header>

        <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Ultimo Scansionato</p>
                    <h3 id="infoBarcode" class="text-2xl font-black text-slate-900 font-mono tracking-tighter truncate">-</h3>
                </div>
                <div id="statusCard" class="bg-slate-100 p-4 rounded-2xl shadow-sm border border-slate-200 transition-colors">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Stato Sistema</p>
                    <div class="flex items-center gap-2">
                        <i id="statusIcon" class="fa-solid fa-circle-question text-lg text-slate-400"></i>
                        <span id="statusMessage" class="font-bold text-slate-600 truncate">Attendere scansione...</span>
                    </div>
                </div>
            </div>

            <div class="relative flex-1 min-h-[300px]">
                <div id="reader"></div>
                <div class="scanner-overlay pointer-events-none">
                    <div class="laser-box">
                        <div class="laser-line"></div>
                        <div class="absolute -bottom-10 left-0 w-full text-center">
                            <span class="text-xs brand-text-blue font-bold uppercase tracking-widest bg-blue-100 px-3 py-1 rounded-full border brand-border-blue">INQUADRA IL CODICE</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="h-20"></div>
        </main>

        <footer class="sticky bottom-0 z-30 bg-white border-t border-slate-200 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] p-4 flex gap-4 disabled:opacity-50">
            <button onclick="processMovement('IN')" id="stockBtn" disabled class="flex-1 bg-emerald-50 text-emerald-700 border-2 border-emerald-500 font-bold py-5 rounded-2xl active:bg-emerald-100 active:scale-95 transition-all flex flex-col items-center gap-2 shadow-sm disabled:border-slate-300 disabled:text-slate-400 disabled:bg-slate-50">
                <i class="fa-solid fa-box-open text-3xl"></i>
                <span class="text-lg">STOCK (IN)</span>
            </button>
            <button onclick="processMovement('OUT')" id="pickBtn" disabled class="flex-1 bg-rose-50 text-rose-700 border-2 border-rose-500 font-bold py-5 rounded-2xl active:bg-rose-100 active:scale-95 transition-all flex flex-col items-center gap-2 shadow-sm disabled:border-slate-300 disabled:text-slate-400 disabled:bg-slate-50">
                <i class="fa-solid fa-dolly text-3xl"></i>
                <span class="text-lg">PICK (OUT)</span>
            </button>
        </footer>
    </div>

    <script>
        // ================= CONFIGURAZIONE =================
        const WORKER_URL = "https://tyxghf.sviluppo-49a.workers.dev"; 
        
        let isUnlocked = localStorage.getItem("wms_unlocked") === "true";
        let accessToken = localStorage.getItem("wms_db_token");
        let html5QrcodeScanner = null;
        let currentBarcode = null;

        document.addEventListener('DOMContentLoaded', () => {
            handleRedirect();
            checkAppStatus();
        });

        // ================= ROUTING & STATO =================
        function checkAppStatus() {
            if (!isUnlocked) {
                showScreen('loginScreen');
            } else if (!accessToken) {
                showScreen('authScreen');
            } else {
                showScreen('scannerScreen');
                updateConnectionStatus(true);
                initCamera();
            }
        }

        function showScreen(id) {
            ['loginScreen', 'authScreen', 'scannerScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function updateConnectionStatus(isOnline) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            if(isOnline) {
                dot.className = 'connection-status status-online'; text.innerText = 'Connesso'; text.className = 'brand-text-blue';
            } else {
                dot.className = 'connection-status status-offline'; text.innerText = 'Offline'; text.className = 'text-slate-500';
            }
        }

        function setSystemFeedback(msg, type = "default") {
            const card = document.getElementById('statusCard');
            const icon = document.getElementById('statusIcon');
            const message = document.getElementById('statusMessage');
            message.innerText = msg;

            if(type === "success") {
                card.className = "bg-emerald-50 p-4 rounded-2xl shadow-sm border border-emerald-300 transition-colors";
                icon.className = "fa-solid fa-check-circle text-lg text-emerald-500";
                message.className = "font-bold text-emerald-800 truncate";
            } else if(type === "error") {
                card.className = "bg-rose-50 p-4 rounded-2xl shadow-sm border border-rose-300 transition-colors";
                icon.className = "fa-solid fa-triangle-exclamation text-lg text-rose-500";
                message.className = "font-bold text-rose-800 truncate";
            } else if(type === "loading") {
                card.className = "bg-blue-50 p-4 rounded-2xl shadow-sm border border-blue-200 transition-colors animate-pulse";
                icon.className = "fa-solid fa-circle-notch fa-spin text-lg text-blue-500";
                message.className = "font-bold text-blue-700 truncate";
            } else {
                card.className = "bg-slate-100 p-4 rounded-2xl shadow-sm border border-slate-200 transition-colors";
                icon.className = "fa-solid fa-circle-question text-lg text-slate-400";
                message.className = "font-bold text-slate-600 truncate";
            }
        }

        // ================= 1. LOGIN AZIENDALE =================
        async function verifyLogin() {
            const user = document.getElementById('userInp').value.trim();
            const pass = document.getElementById('passInp').value.trim();
            const btn = document.getElementById('loginBtn');
            if(!user || !pass) return;

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>'; btn.disabled = true;

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "verifyLogin", user: user, pass: pass })
                });
                const data = await res.json();
                if (data.success) {
                    isUnlocked = true; localStorage.setItem("wms_unlocked", "true");
                    checkAppStatus();
                } else {
                    setSystemFeedback("Credenziali Errate", "error");
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            } catch (e) {
                setSystemFeedback("Errore server (Azienda)", "error");
            } finally {
                btn.innerHTML = 'Sblocca Terminale'; btn.disabled = false;
            }
        }

        // ================= 2. OAUTH DROPBOX =================
        async function loginDropbox() {
            const btn = document.getElementById('dbBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Attendere...';
            try {
                const res = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "getAuthUrl" }) });
                const data = await res.json();
                if (data.success && data.url) window.location.href = data.url;
            } catch (e) {
                updateConnectionStatus(false);
                setSystemFeedback("Server irraggiungibile (Dropbox)", "error"); btn.innerHTML = '<i class="fa-solid fa-link"></i> Autorizza Dropbox';
            }
        }

        function handleRedirect() {
            const hash = window.location.hash;
            if (hash && hash.includes("access_token")) {
                const params = new URLSearchParams(hash.substring(1));
                const token = params.get("access_token");
                if (token) {
                    accessToken = token; localStorage.setItem("wms_db_token", accessToken);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }

        // ================= 3. FOTOCAMERA E SCANNER EMBEDDED =================
        function initCamera() {
            if (html5QrcodeScanner) return; 
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 150 }, aspectRatio: 4/3 };

            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
                .catch(err => {
                    setSystemFeedback("Errore fotocamera. Controlla permessi.", "error");
                });
        }

        function onScanSuccess(decodedText) {
            // Seleziona l'oggetto e aggiorna la UI
            currentBarcode = decodedText;
            document.getElementById('infoBarcode').innerText = currentBarcode;
            
            // Abilita pulsanti e mostra feedback provvisorio
            document.getElementById('stockBtn').disabled = false;
            document.getElementById('pickBtn').disabled = false;
            setSystemFeedback("Scegli operazione...", "default");

            // Feedback aptico Amazon Style (Scansione veloce)
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // ================= 4. PROCESSO MOVIMENTO =================
        async function processMovement(type) {
            const barcode = currentBarcode;
            const btnText = type === 'IN' ? 'STOCK' : 'PICK';
            
            // Disabilita pulsanti e mostra caricamento
            document.getElementById('stockBtn').disabled = true;
            document.getElementById('pickBtn').disabled = true;
            setSystemFeedback(`${btnText} in corso...`, "loading");
            
            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${accessToken}` },
                    body: JSON.stringify({ action: "processMovement", barcode: barcode, type: type })
                });

                const data = await res.json();

                if (res.status === 401 || (data.error && data.error.includes("expired"))) {
                    updateConnectionStatus(false);
                    hardLogout(); return;
                }

                if (data.success) {
                    if (navigator.vibrate) navigator.vibrate(100);
                    setSystemFeedback(`${barcode} registrato (${btnText})`, "success");
                    resetScannerUI();
                } else {
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    setSystemFeedback(data.error || "Operazione fallita.", "error");
                    // Lascia i pulsanti disabilitati per forzare nuova scansione se errore di logica (es già IN)
                    setTimeout(resetScannerUI, 3000); 
                }
            } catch (e) {
                setSystemFeedback("Errore di rete. Controlla connessione.", "error");
                document.getElementById('stockBtn').disabled = false; // Permetti riprova
                document.getElementById('pickBtn').disabled = false;
            }
        }

        // ================= UTILITY =================
        function resetScannerUI() {
            currentBarcode = null;
            document.getElementById('infoBarcode').innerText = "-";
            document.getElementById('stockBtn').disabled = true;
            document.getElementById('pickBtn').disabled = true;
            // setSystemFeedback("Attendere scansione...", "default");
        }

        function hardLogout() {
            localStorage.clear();
            if (html5QrcodeScanner) html5QrcodeScanner.stop();
            window.location.reload();
        }

        /* ================= MOTORE OFFLINE FIRST (INDEXED-DB) ================= */

// 1. IL NUOVO TASTO INVIA (Salva solo sul telefono)
async function uploadData() {
    const op = document.getElementById('operatore').value.trim();
    const impRaw = document.getElementById('impianto').value.trim();
    const luogoRaw = document.getElementById('luogo').value.trim() || "ND";
    const potRaw = document.getElementById('potenza').value.trim() || "0";
    const zRaw = document.getElementById('zona').value;
    const sRaw = document.getElementById('stato').value;

    if(!op || !impRaw || !zRaw || !sRaw || photoFilesQueue.length === 0) {
        showToast("Compila i campi essenziali e scatta almeno una foto.", "error");
        return;
    }

    // Creiamo il pacchetto da salvare offline
    const sessionPayload = {
        id: "sess_" + Date.now(),
        timestamp: new Date().getTime(),
        operatore: op, impianto: impRaw, luogo: luogoRaw, potenza: potRaw,
        zona: zRaw, stato: sRaw, gps: gpsData,
        // Salviamo fisicamente gli oggetti File nel database del telefono
        photos: photoFilesQueue.map(p => p.file) 
    };

    try {
        // Leggiamo la coda attuale, aggiungiamo il nuovo, e salviamo
        let queue = await idbKeyval.get('fieldcam_queue') || [];
        queue.push(sessionPayload);
        await idbKeyval.set('fieldcam_queue', queue);

        // Feedback immediato per l'operatore (zero attesa!)
        showToast("Dati salvati in locale! <i class='fas fa-hdd ml-1'></i>");
        
        sessionUploadedPhotos += sessionPayload.photos.length;
        document.getElementById('photoCountText').innerText = sessionUploadedPhotos;
        document.getElementById('sessionFeedback').style.display = "flex";
        document.getElementById('sessionFeedback').classList.remove('hidden');

        if(!isSessionLocked) lockSessionUI();
        softResetCamera();
        
        // Aggiorna il numerino rosso e prova subito a inviare se c'è rete
        updateSyncBadge();
        processSyncQueue();

    } catch (e) {
        showToast("Errore di memoria del telefono.", "error");
        console.error(e);
    }
}

// 2. IL MOTORE DI SINCRONIZZAZIONE (Invia a Dropbox in background)
let isSyncing = false;

async function processSyncQueue(manualClick = false) {
    if (isSyncing) return;
    
    // Se clicchi la nuvola ma non c'è rete
    if (!navigator.onLine) {
        if(manualClick) showToast("Sei offline. In attesa di rete...", "error");
        return;
    }

    let queue = await idbKeyval.get('fieldcam_queue') || [];
    if (queue.length === 0) {
        if(manualClick) showToast("Tutto sincronizzato!");
        return;
    }

    isSyncing = true;
    const loader = document.getElementById('loaderOverlay');
    const progressFill = document.getElementById('progressFill');
    
    // Se lo fa in automatico in background non disturba l'utente, 
    // se clicca la nuvola mostriamo il loader
    if(manualClick) loader.classList.remove('hidden');

    try {
        // Processiamo i pacchetti in ordine cronologico (il più vecchio prima)
        for (let i = 0; i < queue.length; i++) {
            const session = queue[i];
            
            if(manualClick) document.getElementById('loaderText').innerText = `Invio pacchetto ${i+1} di ${queue.length}...`;
            
            // --- LOGICA DI INVIO REALE ---
            const safeOp = session.operatore.replace(/[^a-zA-Z0-9]/g, '_');
            const safeImp = session.impianto.replace(/[^a-zA-Z0-9]/g, '_');
            const safeLuogo = session.luogo.replace(/[^a-zA-Z0-9]/g, '_');

            const impiantoFolder = `${safeImp}_${safeLuogo}_${session.potenza}MW`;
            const targetFolderPath = `${impiantoFolder}/${session.stato}/${session.zona}`;

            const d = new Date(session.timestamp);
            const dStr = d.toISOString().split('T')[0];
            const tStr = d.toTimeString().split(' ')[0].replace(/:/g, '-');
            
            const photoPrefix = `${dStr}_${tStr}_${safeOp}`;
            const photoNames = session.photos.map((_, idx) => `${photoPrefix}_Foto_${String(idx + 1).padStart(2, '0')}.jpg`);

            const masterData = { operatore: session.operatore, impianto: session.impianto, potenza: session.potenza, luogo: session.luogo, ultimo_aggiornamento: d.toISOString() };
            await proxyFetch(`${impiantoFolder}/dati_cantiere.json`, JSON.stringify(masterData, null, 2), true);

            const sessionData = { id_sessione: `${dStr}_${tStr}`, operatore: session.operatore, impianto: session.impianto, zona: session.zona, stato: session.stato, gps: session.gps, foto_allegate: photoNames };
            await proxyFetch(`${targetFolderPath}/report_sessione_${dStr}_${tStr}.json`, JSON.stringify(sessionData, null, 2), true);

            for (let j = 0; j < session.photos.length; j++) {
                if(manualClick) {
                    document.getElementById('loaderText').innerText = `Invio foto ${j+1} di ${session.photos.length}...`;
                    progressFill.style.width = `${((j+1) / session.photos.length) * 100}%`;
                }
                await proxyFetch(`${targetFolderPath}/${photoNames[j]}`, session.photos[j], false);
            }
            // --- FINE LOGICA DI INVIO ---

            // Se tutto è andato bene, rimuoviamo questo pacchetto dalla coda offline
            let currentQueue = await idbKeyval.get('fieldcam_queue');
            currentQueue = currentQueue.filter(q => q.id !== session.id);
            await idbKeyval.set('fieldcam_queue', currentQueue);
            updateSyncBadge();
        }

        if(manualClick) showToast("Tutti i dati sono stati sincronizzati!");

    } catch (e) {
        if(manualClick) showToast("Rete instabile. L'invio riprenderà in automatico.", "error");
        console.error("Errore sync background:", e);
    } finally {
        if(manualClick) loader.classList.add('hidden');
        isSyncing = false;
        updateSyncBadge();
    }
}

// 3. AGGIORNA LA UI & LISTENER DELLA RETE
async function updateSyncBadge() {
    const queue = await idbKeyval.get('fieldcam_queue') || [];
    const container = document.getElementById('syncBadgeContainer');
    const countEl = document.getElementById('syncBadgeCount');
    
    if (queue.length > 0) {
        container.classList.remove('hidden');
        countEl.innerText = queue.length;
    } else {
        container.classList.add('hidden');
    }
}

// Quando l'app parte, aggiorna la nuvoletta
document.addEventListener('DOMContentLoaded', () => {
    updateSyncBadge();
});

// Ascoltiamo il telefono: appena torna internet, fai partire il sync da solo!
window.addEventListener('online', () => {
    showToast("Sei di nuovo online! Sincronizzazione in background avviata...");
    processSyncQueue();
});
    </script>
</body>
</html>
