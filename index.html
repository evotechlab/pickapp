<!DOCTYPE html>

<title>WMS - Mobile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Inter,sans-serif;
    background:#f1f5f9;
    color:#0f172a;
}

header{
    background:#0f172a;
    color:white;
    padding:18px;
    text-align:center;
    font-weight:700;
    font-size:18px;
}

.container{
    padding:16px;
}

.card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.06);
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #cbd5e1;
    font-size:16px;
}

/* TOGGLE OPERAZIONE */

.toggle{
    display:flex;
    border-radius:14px;
    overflow:hidden;
    margin-top:10px;
}

.toggle button{
    flex:1;
    padding:14px;
    font-weight:700;
    border:none;
    font-size:15px;
}

.toggle button.active{
    color:white;
}

.pick-mode{
    background:#fef9c3;
    color:#92400e;
}

.pick-mode.active{
    background:#facc15;
}

.restock-mode{
    background:#dcfce7;
    color:#166534;
}

.restock-mode.active{
    background:#22c55e;
}

/* SCANNER */

#scanner{
    width:100%;
    min-height:220px;
}

.status{
    margin-top:10px;
    font-size:16px;
    font-weight:600;
}

/* ACTION BUTTON */

.action-btn{
    width:100%;
    padding:20px;
    border:none;
    border-radius:18px;
    font-size:20px;
    font-weight:700;
    margin-top:10px;
}

.action-pick{
    background:#facc15;
    color:#111827;
}

.action-restock{
    background:#22c55e;
    color:white;
}

.action-btn:disabled{
    background:#94a3b8;
}

/* FEEDBACK */

.success{
    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:14px;
    margin-top:12px;
    text-align:center;
    font-weight:600;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:14px;
    margin-top:12px;
    text-align:center;
    font-weight:600;
}
</style>
</head>

<body>

<header>WMS Mobile</header>

<div class="container">

<div class="card">
<input type="text" id="operatore" placeholder="Nome Operatore">
</div>

<div class="card">
<div class="toggle">
    <button id="pickMode" class="pick-mode active" onclick="setMode('pick')">PICK</button>
    <button id="restockMode" class="restock-mode" onclick="setMode('restock')">RESTOCK</button>
</div>
</div>

<div class="card">
<div id="scanner"></div>
<div class="status">
Codice: <span id="barcode">---</span>
</div>
<div id="feedback"></div>
</div>

<div class="card">
<button id="actionBtn" class="action-btn action-pick" onclick="submitAction()">CONFERMA PICK</button>
</div>

</div>

/* ======================
   STATE
====================== */

let currentCode = "";
let currentMode = "pick";
let uploading = false;

/* ======================
   MODE SWITCH
====================== */

function setMode(mode){
    currentMode = mode;

    document.getElementById("pickMode").classList.remove("active");
    document.getElementById("restockMode").classList.remove("active");

    document.getElementById(mode+"Mode").classList.add("active");

    const btn = document.getElementById("actionBtn");

    if(mode === "pick"){
        btn.className = "action-btn action-pick";
        btn.innerText = "CONFERMA PICK";
    }else{
        btn.className = "action-btn action-restock";
        btn.innerText = "CONFERMA RESTOCK";
    }
}

/* ======================
   SCANNER
====================== */

const scanner = new Html5Qrcode("scanner");

scanner.start(
    { facingMode:"environment" },
    {
        fps:12,
        qrbox:{ width:350, height:150 },
        aspectRatio:1.77
    },
    (decodedText)=>{
        currentCode = decodedText;
        document.getElementById("barcode").innerText = decodedText;
        navigator.vibrate?.(100);
    }
);

/* ======================
   DROPBOX UPLOAD
====================== */

async function uploadToDropbox(data){

    const filename = `/movimenti/${Date.now()}_${crypto.randomUUID()}.json`;

    const response = await fetch("https://content.dropboxapi.com/2/files/upload",{
        method:"POST",
        headers:{
            "Authorization":"Bearer "+DROPBOX_TOKEN,
            "Content-Type":"application/octet-stream",
            "Dropbox-API-Arg":JSON.stringify({
                path:filename,
                mode:"add",
                autorename:true
            })
        },
        body:JSON.stringify(data)
    });

    if(!response.ok){
        const err = await response.text();
        throw new Error(err);
    }
}

/* ======================
   ACTION SUBMIT
====================== */

async function submitAction(){

    if(uploading) return;

    const operatore = document.getElementById("operatore").value.trim();
    if(!operatore || !currentCode){
        alert("Compila operatore e scansiona barcode");
        return;
    }

    uploading = true;
    document.getElementById("actionBtn").disabled = true;

    const movement = {
        timestamp:new Date().toISOString(),
        operatore,
        barcode:currentCode,
        azione:currentMode,
        device:"mobile"
    };

    try{
        await uploadToDropbox(movement);
        showSuccess(currentMode.toUpperCase()+" registrato");
        currentCode="";
        document.getElementById("barcode").innerText="---";
    }catch(e){
        showError("Errore upload");
    }

    uploading=false;
    document.getElementById("actionBtn").disabled=false;
}

/* ======================
   FEEDBACK
====================== */

function showSuccess(msg){
    const fb=document.getElementById("feedback");
    fb.innerHTML=`<div class="success">${msg}</div>`;
    setTimeout(()=>fb.innerHTML="",2000);
}

function showError(msg){
    const fb=document.getElementById("feedback");
    fb.innerHTML=`<div class="error">${msg}</div>`;
    setTimeout(()=>fb.innerHTML="",3000);
}

</script>
