<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Magazzino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        /* Toast Notification */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; transition: all 0.3s ease; opacity: 0; z-index: 50; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast.error { background-color: #ef4444; }
        #toast.success { background-color: #10b981; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col text-gray-800">

    <header class="bg-slate-800 text-white p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-barcode text-xl"></i>
            <h1 class="text-lg font-bold">WMS Scanner</h1>
        </div>
        <button onclick="logout()" class="text-slate-300 hover:text-white" title="Disconnetti">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </header>

    <div id="toast">Messaggio</div>

    <div id="loginScreen" class="flex-1 flex flex-col items-center justify-center p-6 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm text-center">
            <i class="fa-brands fa-dropbox text-5xl text-blue-600 mb-4"></i>
            <h2 class="text-2xl font-bold mb-2">Connetti Server</h2>
            <p class="text-gray-500 mb-6 text-sm">Accedi per abilitare lo scanner.</p>
            <button onclick="loginDropbox()" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:scale-95 transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-link"></i> Autorizza Dropbox
            </button>
        </div>
    </div>

    <div id="appScreen" class="flex-1 flex flex-col items-center justify-center p-4 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-sm">
            
            <div class="text-center mb-6">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Codice a Barre</p>
                <input type="text" id="barcodeInput" placeholder="Scansiona o digita..." class="w-full text-center text-3xl font-bold p-4 bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-0 outline-none uppercase transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="processMovement('IN')" class="bg-emerald-500 text-white font-bold py-6 rounded-xl hover:bg-emerald-600 active:scale-95 transition shadow-md flex flex-col items-center justify-center gap-2">
                    <i class="fa-solid fa-box-open text-2xl"></i>
                    <span class="text-lg">STOCK (IN)</span>
                </button>
                <button onclick="processMovement('OUT')" class="bg-rose-500 text-white font-bold py-6 rounded-xl hover:bg-rose-600 active:scale-95 transition shadow-md flex flex-col items-center justify-center gap-2">
                    <i class="fa-solid fa-dolly text-2xl"></i>
                    <span class="text-lg">PICK (OUT)</span>
                </button>
            </div>

            <div id="loader" class="hidden mt-6 text-center text-blue-600 font-bold animate-pulse">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Elaborazione in corso...
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE: INSERISCI QUI IL TUO WORKER
        // ==========================================
        const WORKER_URL = "https://tyxghf.sviluppo-49a.workers.dev/";

        let accessToken = localStorage.getItem("wms_access_token");

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', () => {
            handleRedirect();
            checkAuth();
        });

        // Mostra schermata corretta in base al token
        function checkAuth() {
            if (accessToken) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('flex');
                document.getElementById('barcodeInput').focus(); // Auto-focus per lo scanner laser
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('flex');
            }
        }

        // Chiede al Worker l'URL di Dropbox e reindirizza
        async function loginDropbox() {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Attendere...';
            btn.disabled = true;

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "getAuthUrl" })
                });
                const data = await res.json();
                if (data.success && data.url) {
                    window.location.href = data.url;
                } else {
                    showToast("Errore di configurazione del server", "error");
                    btn.innerHTML = '<i class="fa-solid fa-link"></i> Autorizza Dropbox';
                    btn.disabled = false;
                }
            } catch (e) {
                showToast("Server irraggiungibile", "error");
                btn.innerHTML = '<i class="fa-solid fa-link"></i> Autorizza Dropbox';
                btn.disabled = false;
            }
        }

        // Estrae il token dall'URL dopo il rientro da Dropbox
        function handleRedirect() {
            const hash = window.location.hash;
            if (hash && hash.includes("access_token")) {
                const params = new URLSearchParams(hash.substring(1));
                const token = params.get("access_token");
                if (token) {
                    accessToken = token;
                    localStorage.setItem("wms_access_token", accessToken);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }

        // Elabora l'operazione IN o OUT
        async function processMovement(type) {
            const barcodeInput = document.getElementById('barcodeInput');
            const barcode = barcodeInput.value.trim().toUpperCase();

            if (!barcode) {
                showToast("Inserisci o scansiona un codice!", "error");
                barcodeInput.focus();
                return;
            }

            document.getElementById('loader').classList.remove('hidden');
            
            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({
                        action: "processMovement",
                        barcode: barcode,
                        type: type
                    })
                });

                const data = await res.json();

                if (res.status === 401 || (data.error && data.error.includes("expired"))) {
                    logout("Sessione scaduta, esegui nuovo accesso.");
                    return;
                }

                if (data.success) {
                    showToast(`${barcode} registrato come ${type} con successo!`, "success");
                    barcodeInput.value = ""; // Svuota il campo per il prossimo oggetto
                    barcodeInput.focus();
                } else {
                    showToast(data.error || "Errore sconosciuto", "error");
                    barcodeInput.focus();
                }

            } catch (e) {
                showToast("Errore di rete. Riprova.", "error");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function logout(msg = null) {
            localStorage.removeItem("wms_access_token");
            accessToken = null;
            checkAuth();
            if(msg) alert(msg);
        }
    </script>
</body>
</html>
